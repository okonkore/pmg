<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bar Drop 楽器</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app" aria-label="Bar Drop Instrument">
      <canvas id="stage" aria-label="楽器キャンバス"></canvas>

      <div class="hud hud-top">
        <div class="brand-area">
          <button id="songMenuButton" class="icon-button menu-button" type="button" aria-label="曲メニュー" aria-expanded="false" title="曲メニュー">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 17h16"></path>
            </svg>
          </button>
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-title">Bar Drop</span>
            <span id="currentSongName" class="current-song-name" title="現在の曲">名称未設定</span>
          </div>
          <div id="songMenu" class="song-menu" hidden>
            <div id="songMenuRoot" class="song-menu-view">
              <div class="song-menu-title">曲</div>
              <button id="newSongButton" class="song-menu-action" type="button">新規</button>
              <button id="openSongMenuButton" class="song-menu-action" type="button">開く</button>
              <button id="duplicateDimensionMenuButton" class="song-menu-action" type="button">複製</button>
              <button id="overwriteSongButton" class="song-menu-action" type="button" disabled>上書き保存</button>
              <button id="songSaveMenuButton" class="song-menu-action" type="button">名前をつけて保存</button>
              <button id="exportSongButton" class="song-menu-action" type="button">エクスポート</button>
              <button id="importSongButton" class="song-menu-action" type="button">インポート</button>
              <input id="songImportInput" type="file" accept="application/json,.json" hidden>
            </div>
            <div id="songSaveView" class="song-menu-view" hidden>
              <div class="song-menu-header">
                <button class="song-back-button" type="button" data-song-menu-back aria-label="戻る">戻る</button>
                <div class="song-menu-title">名前をつけて保存</div>
              </div>
              <label class="song-name-field">
                <span>名前</span>
                <input id="songNameInput" type="text" maxlength="40" autocomplete="off">
              </label>
              <button id="saveSongButton" class="song-save-button" type="button">保存</button>
            </div>
            <div id="songOpenView" class="song-menu-view" hidden>
              <div class="song-menu-header">
                <button class="song-back-button" type="button" data-song-menu-back aria-label="戻る">戻る</button>
                <div class="song-menu-title">開く</div>
              </div>
              <div id="songList" class="song-list" aria-label="保存した曲"></div>
            </div>
            <div id="songExportView" class="song-menu-view" hidden>
              <div class="song-menu-header">
                <button class="song-back-button" type="button" data-song-menu-back aria-label="戻る">戻る</button>
                <div class="song-menu-title">エクスポート</div>
              </div>
              <div id="exportFileName" class="song-export-name"></div>
              <div class="song-export-actions">
                <button id="downloadExportButton" class="song-save-button" type="button">保存</button>
                <button id="copyExportButton" class="song-save-button" type="button">コピー</button>
              </div>
              <textarea id="exportJsonOutput" class="song-export-output" readonly spellcheck="false" aria-label="エクスポートJSON"></textarea>
            </div>
            <div id="songImportView" class="song-menu-view" hidden>
              <div class="song-menu-header">
                <button class="song-back-button" type="button" data-song-menu-back aria-label="戻る">戻る</button>
                <div class="song-menu-title">インポート</div>
              </div>
              <div class="song-export-actions">
                <button id="chooseImportFileButton" class="song-save-button" type="button">ファイル</button>
                <button id="importTextButton" class="song-save-button" type="button">貼付読込</button>
              </div>
              <textarea id="importJsonInput" class="song-export-output" spellcheck="false" aria-label="インポートJSON" placeholder="JSONをここに貼り付けても読み込めます"></textarea>
            </div>
            <div id="songMenuStatus" class="song-menu-status" aria-live="polite"></div>
          </div>
        </div>

        <div class="tool-group" role="group" aria-label="tools">
          <button id="playButton" class="icon-button" type="button" aria-label="再生" title="再生">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7-11-7z"></path>
            </svg>
            <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7h10v10H7z"></path>
            </svg>
          </button>
          <span id="playMeasureBadge" class="play-measure-badge" aria-live="polite">M1/4</span>
          <button id="undoButton" class="icon-button" type="button" aria-label="直前のバーを戻す" title="戻す">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 14 4 9l5-5"></path>
              <path d="M4 9h10a6 6 0 1 1-4.4 10.1"></path>
            </svg>
          </button>
          <button id="muteButton" class="icon-button" type="button" aria-label="ミュート" title="ミュート">
            <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10v4h4l5 4V6l-5 4H4z"></path>
              <path d="M17 9a4 4 0 0 1 0 6"></path>
              <path d="M19.5 6.5a8 8 0 0 1 0 11"></path>
            </svg>
            <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10v4h4l5 4V6l-5 4H4z"></path>
              <path d="M18 9l4 4"></path>
              <path d="M22 9l-4 4"></path>
            </svg>
          </button>
          <button id="settingsButton" class="icon-button settings-button" type="button" aria-label="曲全体設定" aria-expanded="false" aria-controls="settingsDialog" title="曲全体設定">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h9"></path>
              <circle cx="17" cy="7" r="2"></circle>
              <path d="M4 12h4"></path>
              <circle cx="12" cy="12" r="2"></circle>
              <path d="M16 12h4"></path>
              <path d="M4 17h11"></path>
              <circle cx="19" cy="17" r="2"></circle>
            </svg>
          </button>
          <button id="zoomOutButton" class="icon-button" type="button" aria-label="縮小" title="縮小">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14"></path>
            </svg>
          </button>
          <button id="zoomResetButton" class="icon-button" type="button" aria-label="表示を戻す" title="表示を戻す">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v4"></path>
              <path d="M12 17v4"></path>
              <path d="M3 12h4"></path>
              <path d="M17 12h4"></path>
              <circle cx="12" cy="12" r="4"></circle>
            </svg>
          </button>
          <button id="zoomInButton" class="icon-button" type="button" aria-label="拡大" title="拡大">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>
          </button>
        </div>

        <div class="readout" aria-live="polite">
          <span id="barCount">0 本</span>
          <span id="noteName">--</span>
        </div>
      </div>

      <div id="settingsDialog" class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsDialogTitle" hidden>
        <section class="settings-panel">
          <div class="settings-header">
            <h2 id="settingsDialogTitle">曲全体設定</h2>
            <button id="settingsCloseButton" class="icon-button settings-close-button" type="button" aria-label="閉じる" title="閉じる">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12"></path>
                <path d="M18 6L6 18"></path>
              </svg>
            </button>
          </div>
          <div class="settings-grid">
            <label class="control">
              <span>重力</span>
              <input id="gravitySlider" type="range" min="0.2" max="1.8" value="0.82" step="0.02">
            </label>
            <label class="control">
              <span>BPM</span>
              <input id="bpmInput" type="number" min="40" max="240" value="120" step="1">
            </label>
            <label class="control checkbox-control">
              <span>メトロ</span>
              <input id="metronomeCheckbox" type="checkbox" aria-label="メトロノーム">
            </label>
            <label class="control">
              <span>小節数</span>
              <select id="measureCountSelect" aria-label="小節数">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
              </select>
            </label>
            <label class="control">
              <span>音階</span>
              <select id="scaleSelect" aria-label="音階">
                <option value="pentatonic">ペンタ</option>
                <option value="major">長音階</option>
                <option value="minor">短音階</option>
                <option value="chromatic" selected>半音階</option>
              </select>
            </label>
            <label class="control">
              <span>次元数</span>
              <select id="dimensionCountSelect" aria-label="次元数">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </label>
            <label class="control">
              <span>量子化</span>
              <select id="quantizeGridSelect" aria-label="クオンタイズ単位">
                <option value="16">16分</option>
                <option value="8">8分</option>
                <option value="4">4分</option>
              </select>
            </label>
          </div>
        </section>
      </div>

      <div id="duplicateDialog" class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="duplicateDialogTitle" hidden>
        <section class="settings-panel duplicate-panel">
          <div class="settings-header">
            <h2 id="duplicateDialogTitle">複製</h2>
            <button id="duplicateCloseButton" class="icon-button settings-close-button" type="button" aria-label="閉じる" title="閉じる">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12"></path>
                <path d="M18 6L6 18"></path>
              </svg>
            </button>
          </div>
          <div id="duplicateSourceLabel" class="duplicate-summary">コピー元: --</div>
          <div class="settings-grid duplicate-grid">
            <label class="control">
              <span>小節</span>
              <select id="duplicateMeasureSelect" aria-label="複製先の小節"></select>
            </label>
            <label class="control">
              <span>次元</span>
              <select id="duplicateDimensionSelect" aria-label="複製先の次元"></select>
            </label>
          </div>
          <div class="duplicate-actions">
            <button id="duplicateApplyButton" class="song-save-button" type="button">複製</button>
          </div>
          <div id="duplicateDialogStatus" class="song-menu-status duplicate-status" aria-live="polite"></div>
        </section>
      </div>

      <div class="hud hud-side">
        <label class="control">
          <span>Oct</span>
          <select id="barOctaveSelect" aria-label="選択バーのオクターブ">
            <option value="-2">-2</option>
            <option value="-1">-1</option>
            <option value="0" selected>0</option>
            <option value="1">+1</option>
            <option value="2">+2</option>
          </select>
        </label>
        <div class="control">
          <span>音程</span>
          <output id="barPitchOutput" class="property-readout pitch-readout" aria-label="選択バーの音程">--</output>
        </div>
        <label class="control">
          <span>音色</span>
          <select id="barTimbreSelect" aria-label="選択バーの音色">
            <option value="pluck" selected>Pluck</option>
            <option value="bell">Bell</option>
            <option value="wood">Wood</option>
            <option value="pad">Pad</option>
          </select>
        </label>
        <div class="control">
          <span>位置</span>
          <output id="barPositionOutput" class="property-readout" aria-label="選択バーの小節内位置">--</output>
        </div>
        <label class="control bar-bounce-control">
          <span>反発</span>
          <div class="range-with-value">
            <input id="barBounceSlider" type="range" min="0.35" max="2.10" value="0.82" step="0.01">
            <output id="barBounceOutput" class="range-value" for="barBounceSlider">0.82</output>
          </div>
        </label>
        <div class="control">
          <span>調整</span>
          <button id="quantizeButton" class="quantize-button" type="button">選択バー</button>
        </div>
        <div class="control">
          <span>削除</span>
          <button id="clearButton" class="icon-button delete-bar-button" type="button" aria-label="選択バーを削除" title="選択バーを削除">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M6 6l1 15h10l1-15"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="hud hud-bottom">
        <label class="control">
          <span>小節</span>
          <select id="activeMeasureSelect" aria-label="編集する小節">
            <option value="0">小節 1</option>
          </select>
        </label>
        <label class="control">
          <span>編集</span>
          <select id="activeDimensionSelect" aria-label="編集する次元">
            <option value="0">次元 1</option>
          </select>
        </label>
        <div class="control">
          <span>消音</span>
          <div id="dimensionMuteGroup" class="dimension-mutes" role="group" aria-label="次元ごとのミュート"></div>
        </div>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
