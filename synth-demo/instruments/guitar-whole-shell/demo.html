<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>引き継ぎ音源 E4</title><body><h1>最新B・E4</h1><p>保存した音をそのまま再生します。打撃音は未解決です。</p><button id="play">読み込んで鳴らす</button><p id="status" role="status"></p><script type="module">
import { loadGuitar } from './instrument.js';
let context, instrument;
const button = document.querySelector('#play'), status = document.querySelector('#status');
button.onclick = async () => {
  button.disabled = true;
  try {
    context ??= new AudioContext();
    await context.resume();
    status.textContent = '読み込み中…';
    instrument ??= await loadGuitar(context);
    instrument.play();
    status.textContent = '再生しました';
  } catch (error) { status.textContent = error.message; }
  finally { button.disabled = false; }
};
</script></body></html>
