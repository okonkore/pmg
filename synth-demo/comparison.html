<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ギター音色の比較</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#191510;color:#f5ead8}body{margin:0;padding:36px 20px}main{max-width:660px;margin:auto;background:linear-gradient(135deg,#65432f,#35261c);border:1px solid #a77b52;border-radius:18px;padding:28px}h1{font-size:25px;margin-top:0}p{line-height:1.8;color:#e7d1b0}audio{display:block;width:100%;margin:22px 0}a{color:#f0d59e}button{font:inherit;background:#e6cf9f;color:#352519;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}#status{font-size:13px;min-height:24px}small{color:#c3ae8f}nav{display:flex;gap:22px;flex-wrap:wrap;margin-top:24px}
</style>
</head>
<body><main>
<h1>ギター音色の比較（2026-10-20）</h1>
<p>この音源は前回の調整の記録です。4〜6弦の最新音色は<a href="./">楽器本体</a>の単音ボタンで確認できます。</p>
<p>E2 → D3 → G3 → E4 → F♯4 → A4。<br>各音が<strong>調整前 → 調整後</strong>の順に鳴ります。</p>
<button id="play" type="button">▶ 比較を再生</button>
<audio id="audio" controls preload="metadata" src="audio/guitar-tone-before-after.wav">音声を再生できない場合は、下のリンクからWAVを開いてください。</audio>
<p id="status" role="status">30秒の比較音源です。</p>
<small>合成した単音のみ。弾き始めの音量を揃えています。参考録音は含みません。</small>
<nav><a href="audio/guitar-tone-before-after.wav" download>WAVをダウンロード</a><a href="./">楽器に戻る</a></nav>
</main><script>
const audio=document.getElementById('audio'),button=document.getElementById('play'),status=document.getElementById('status');
button.onclick=async()=>{try{if(audio.paused){await audio.play()}else audio.pause()}catch(error){status.textContent='再生できませんでした。WAVのダウンロードをお試しください。'}};
audio.onplay=()=>{button.textContent='❚❚ 一時停止';status.textContent='再生中：各音は調整前 → 調整後の順です。'};
audio.onpause=()=>button.textContent='▶ 比較を再生';audio.onended=()=>{button.textContent='▶ もう一度再生';status.textContent='比較音源の再生が終わりました。'};
audio.onerror=()=>status.textContent='音声を読み込めませんでした。再読み込み、またはWAVのダウンロードをお試しください。';
</script></body></html>
