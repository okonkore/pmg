name: Deploy guitar to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'synth-demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble static app
        run: |
          mkdir -p _site
          cp synth-demo/*.html synth-demo/*.js synth-demo/*.css _site/
          mkdir -p _site/audio
          cp synth-demo/audio/guitar-tone-before-after.wav _site/audio/
          cp -R synth-demo/reference-comparison _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
